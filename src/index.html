<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Determine the nutritional value of your Pokémon"
    />
    <meta name="author" content="Kaden Beck | WDD330" />
    <title>Pokémon Menu</title>
    <!-- favicon -->
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./js/main.js"></script>
  </head>

  <body>
    <header id="header-partial"></header>
    <main>
      <p>
        Use this web app to get the imaginary nutritional information for a
        given pokemon. Just enter a pokemon ID below to search:
      </p>
      <form action="/pokemon/" method="GET">
        <fieldset>
          <legend>~Pokemon ID Search~</legend>
          <label for="pokemonID">Pokémon ID:</label>
          <input
            type="number"
            name="pokemonID"
            id="pokemonID"
            min="1"
            max="1025"
            step="1"
            value="1"
            required
            autofocus
          />
        </fieldset>
        <input type="submit" value="Get Nutrition" class="anchor-button" />
      </form>
    </main>
    <footer id="footer-partial"></footer>
  </body>
</html>
