<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Determine the nutritional value of your Pokemon" />
    <meta name="author" content="Kaden Beck | WDD330" />
    <title>Pokémon Details</title>
    <!-- favicon -->
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="../js/pokemon.js" defer></script>
  </head>

  <body>
    <header id="header-partial"></header>
    <main>
      <section class="pokemon-details">
        <h2 id="p-name">Pokémon Name</h2>
        <img
          id="p-sprite"
          class="hover-spin"
          src="/images/unown-sprite.png"
          alt="Sprite of Pokémon"
          height="100"
          width="100"
        />
        <span id="p-types">--Types--</span>
        <p id="flavor-text">
          Their shapes look like hieroglyphs on ancient tablets. It is said that the two are somehow
          related.
        </p>
        <div id="nutrition-facts">
          <h3>Nutritional Information</h3>
          <p>Pokemon Weight: 0 grams</p>
          <ul>
            <strong>Nutrients by Weight:</strong>
            <li>Carbs: 0 g</li>
            <li>Fat: 0 g</li>
            <li>Protein: 0 g</li>
            <span><strong>Total Calories:</strong> 0 g</span>
          </ul>
        </div>
      </section>
      <div class="details-menu">
        <a class="anchor-button hover-zoom" id="previous" href="#">&lt;</a>
        <a class="anchor-button hover-zoom" href="/">Home</a>
        <a class="anchor-button hover-zoom" id="next" href="#">&gt;</a>
      </div>
    </main>
    <footer id="footer-partial"></footer>
  </body>
</html>
