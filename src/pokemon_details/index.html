<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Determine the nutritional value of your Pokemon"
    />
    <meta name="author" content="Kaden Beck | WDD330" />
    <title>Pokemon Details</title>
    <!-- favicon -->
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./js/main.js"></script>
  </head>

  <body>
    <header id="header-partial"></header>
    <main>
      <section class="pokemon-details">
        <h2 id="p-name">Pokemon Details</h2>
        <span id="p-types">Types</span>
        <img src="/images/unown-sprite.png" alt="Sprite of Pokemon" />
        <p id="flavor-text">
          Their shapes look like hieroglyphs on ancient tablets. It is said that
          the two are somehow related.
        </p>
        <div id="nutrition-facts">
          <h3>Nutritional Information</h3>
          <ul>
            <li>Carbs: 0g</li>
            <li>Fat: 0g</li>
            <li>Protein: 0g</li>
            <p>Total Calories: 0g</p>
          </ul>
        </div>
        <a href="/">Return Home</a>
      </section>
    </main>
    <footer id="footer-partial"></footer>
  </body>
</html>
